# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true

# Android settings
android.useAndroidX=true

# Filament KMP metadata
filaVersion=1.77.2
# Emscripten SDK for the wasm builds: upstream Filament's pin (BUILDING.md); bump alongside filaVersion.
emsdkVersion=5.0.4
# ANGLE for the Windows build (its GL backend runs on ANGLE): the DLLs of NucleusFramework/angle's release (the ANGLE Nucleus
# ships), for import libraries, and the ANGLE commit that release was built from, for headers. Bump with Nucleus's.
angleRelease=8059
angleCommit=170484eea03a4255a388072add4232e1fadfbee4
libVersion=0.7.7
projectGroup=dev.nucleusframework.filament

# Maven Central Metadata
maven.name=Filament KMP
maven.description=Kotlin Multiplatform wrapper for the Filament rendering engine.
maven.url=https://github.com/kdroidFilter/filament-kmp
maven.inceptionYear=2026
maven.scm=scm:git:git://github.com/kdroidFilter/filament-kmp.git
maven.scm.dev=scm:git:ssh://git@github.com/kdroidFilter/filament-kmp.git
maven.license.name=The Apache License, Version 2.0
maven.license.url=http://www.apache.org/licenses/LICENSE-2.0.txt
maven.developer.id=Erkko68
maven.developer.name=Eric
maven.developer.email=eric.bitria@gmail.com

# Performance
org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true

# Dokka V2 (V1 crashes on newer daemon JDKs)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
